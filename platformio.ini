; ESP32-S3 N16R8 (16MB flash, 8MB OPI PSRAM).
; Arduino core 3.x is required; the official espressif32 platform only ships 2.x.
; Core 3.3.11 breaks the S3 USB Host driver (espressif/arduino-esp32#12783), so stay on 3.3.9.

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = app3M_fat9M_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    https://github.com/tanakamasayuki/EspUsbHost.git#cf20760dc65d6d70f5f33434642da49cee0d74e1
    adafruit/Adafruit NeoPixel@1.15.5

monitor_speed = 115200
